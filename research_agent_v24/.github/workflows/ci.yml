name: offline-verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESEARCH_AGENT_DATABASE_URL: sqlite:///data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install locked development environment
        run: uv sync --dev --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Offline tests
        run: uv run pytest -q
      - name: Rebuild synchronized registry from immutable artifacts
        run: |
          mkdir -p data/ci-outputs
          uv run research-agent import-master
          uv run research-agent apply-registry-changes \
            data/portal_resolution/registry_corrections_run17_v1.csv \
            --source-version registry-corrections-run17-v1 \
            --master-output data/ci-outputs/v1_6.csv
          uv run research-agent apply-registry-changes \
            data/portal_resolution/registry_corrections_run23_v1.csv \
            --source-version v1.7-registry-corrections-run23 \
            --master-output data/ci-outputs/v1_7.csv
          uv run research-agent apply-registry-changes \
            data/portal_resolution/registry_corrections_run24_v1.csv \
            --source-version v1.8-registry-corrections-run24 \
            --master-output data/ci-outputs/v1_8.csv
          uv run research-agent apply-registry-changes \
            data/portal_resolution/registry_corrections_run26_v1.csv \
            --source-version registry-corrections-run26-v1 \
            --master-output data/ci-outputs/v1_9.csv
          uv run research-agent apply-registry-changes \
            data/portal_resolution/registry_wave6_v1.csv \
            --source-version v1.10-wave6 \
            --master-output data/ci-outputs/v1_10.csv
          uv run research-agent import-company-aliases \
            data/company_aliases/company_aliases_v1.csv \
            --source-version company-aliases-v1
      - name: Acceptance and benchmark gates
        run: |
          uv run research-agent validate-master \
            --report data/ci-outputs/master-validation.md \
            --json-report data/ci-outputs/master-validation.json
          uv run research-agent benchmark-taxonomy \
            --report data/ci-outputs/taxonomy-benchmark.md \
            --json-report data/ci-outputs/taxonomy-benchmark.json
      - name: Recovery drill
        run: |
          uv run research-agent backup-db --output data/ci-outputs/ci-backup.db
          uv run research-agent verify-recovery data/ci-outputs/ci-backup.db \
            --destination data/ci-outputs/ci-restored.db \
            --report data/ci-outputs/recovery.md
