version: 0.1
purpose: >-
  First end-to-end P0 pilot on lower-criticality cybersecurity employers with different
  career-stack families. The cohort is deliberately small and is not a ranking.
network_policy:
  concurrency: 1
  max_requests_per_portal: 3
  max_pages_per_portal: 1
  max_jobs_per_portal: 10
  retries: 0
  inter_portal_wait_seconds: 10
portals:
