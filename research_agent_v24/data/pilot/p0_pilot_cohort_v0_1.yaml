    employer: Detectify
    reason: security employer; prior successful access; official Workday route corrected after P0 pilot
  - portal_id: 535
    employer: Trellix
    reason: security employer; prior successful access; official Workday route corrected after P0 pilot
  - portal_id: 177
    employer: Horizon3.ai
    reason: security employer; prior successful access; Ashby
  - portal_id: 214
    employer: Safe Security
    reason: security employer; prior successful access; Lever
  - portal_id: 280
    employer: Wazuh
    reason: security employer; prior successful access; custom/backend-unverified stack
