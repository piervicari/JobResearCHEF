version: '0.1'
status: PROPOSED_FOR_HUMAN_REVIEW
date: '2026-09-02'
principles:
- Explicit human-curated employers; no algorithmic ranking.
- Tier means scan urgency for this project, not worldwide company importance.
- Cybersecurity-only pilot; all cyber seniorities are in scope.
- 'No Tier C: employers too low-priority for B should normally stay outside the operational target set.'
tier_definitions:
  S:
    meaning: Must-not-miss employer; very low desired discovery latency.
    initial_cadence: 3 scans/day
  A:
    meaning: Highly valuable employer; systematic monitoring.
    initial_cadence: 1 scan/day
  B:
    meaning: Useful opportunity/intelligence employer; lower urgency.
    initial_cadence: 3 scans/week
